<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc"><title id="title">Overall framework of TPTAF</title><desc id="desc">TPTAF organizes feature extraction into unimodal feature decomposition and multimodal detection-semantic extraction, then performs task-prior-guided tripartite attention and reconstruction.</desc><rect width="1500" height="720" fill="#fff"/><text x="750" y="44" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">Overall Framework of TPTAF</text><rect x="35" y="145" width="165" height="105" rx="18" fill="#fde7cf" stroke="#475569" stroke-width="2"/><text x="117" y="195" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700">Visible image</text><rect x="35" y="350" width="165" height="105" rx="18" fill="#dceeff" stroke="#475569" stroke-width="2"/><text x="117" y="400" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700">Infrared image</text><rect x="270" y="85" width="350" height="430" rx="18" fill="#f8fafc" stroke="#475569" stroke-width="2"/><text x="445" y="121" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700">Unimodal Feature Decomposition</text><rect x="465" y="140" width="125" height="130" rx="18" fill="#e8f8e7" stroke="#475569" stroke-width="2"/><text x="527" y="190" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700">PCSB</text><text x="527" y="220" text-anchor="middle" font-family="Arial" font-size="14">structural space</text><rect x="465" y="335" width="125" height="130" rx="18" fill="#e2f3ff" stroke="#475569" stroke-width="2"/><text x="527" y="385" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700">DDEB</text><text x="527" y="415" text-anchor="middle" font-family="Arial" font-size="14">discriminative space</text><rect x="270" y="555" width="620" height="120" rx="18" fill="#fff0e6" stroke="#475569" stroke-width="2"/><text x="580" y="600" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700">Multimodal Detection-Semantic Extraction</text><text x="580" y="638" text-anchor="middle" font-family="Arial" font-size="15">Preprocess + detector backbone + detection semantics</text><rect x="700" y="105" width="420" height="390" rx="18" fill="#fff9d9" stroke="#475569" stroke-width="2"/><text x="910" y="150" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700">Tripartite Attention Module (TAM)</text><text x="910" y="230" text-anchor="middle" font-family="Arial" font-size="16">Structure + discriminative details + detection prior</text><text x="910" y="285" text-anchor="middle" font-family="Arial" font-size="16">DPG-guided cross-modal interaction</text><rect x="1195" y="205" width="265" height="190" rx="18" fill="#eefbe8" stroke="#475569" stroke-width="2"/><text x="1327" y="255" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700">Image Reconstruction</text><text x="1327" y="320" text-anchor="middle" font-family="Arial" font-size="16">Task-aware feature</text><text x="1327" y="365" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700">Fused image</text><rect x="1110" y="535" width="350" height="135" rx="18" fill="#f6eaff" stroke="#475569" stroke-width="2"/><text x="1285" y="575" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700">Uncertainty-Weighted Learning</text><text x="1285" y="615" text-anchor="middle" font-family="Arial" font-size="14">3 fusion losses + 3 detection losses</text><g stroke="#334155" stroke-width="3" fill="none"><path d="M200 197 L270 197"/><path d="M200 402 L270 402"/><path d="M620 205 L700 205"/><path d="M620 400 L700 400"/><path d="M1120 300 L1195 300"/><path d="M890 615 L1110 615"/></g></svg>